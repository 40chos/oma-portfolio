# Cloud-mode model map: maps the logical model names OMA's specialists
# request (OMA_MODEL_BUILD / OMA_MODEL_MANAGER / etc. -- set these to the
# names on the left in .env when OMA_LLM_MODE=cloud) onto real Anthropic
# models, reachable through LiteLLM's OpenAI-compatible /v1/chat/completions
# so infra/gateway_client.py needs no second code path for cloud mode.
# All three roles pinned to gpt-4o-mini for the one-time demo-capture run --
# cheapest capable OpenAI model, a few cents for a full end-to-end trace.
# Swap to gpt-4o or a claude-* / anthropic model (see git history) for a
# higher-quality interview demo; cost scales accordingly. Names on the left
# are what OMA_MODEL_BUILD/MANAGER/etc. should be set to in .env.
model_list:
  - model_name: openai-coder
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai-reasoning
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai-fast-extraction
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
