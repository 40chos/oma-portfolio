name: oma

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${OMA_PG_USER:-oma}
      POSTGRES_PASSWORD: ${OMA_PG_PASSWORD:-oma_dev_password}
      POSTGRES_DB: ${OMA_PG_DB:-oma}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo16_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OMA_PG_USER:-oma}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${OMA_PG_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${OMA_REDIS_PASSWORD:-oma_dev_password}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${OMA_REDIS_PASSWORD:-oma_dev_password} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${OMA_REDIS_HOST_PORT:-6379}:6379"

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-oma_dev_password}"
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"

  odoo-init:
    image: odoo:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: "5432"
      USER: ${OMA_PG_USER:-oma}
      PASSWORD: ${OMA_PG_PASSWORD:-oma_dev_password}
    # Writes a real odoo.conf with db connection settings baked in (not just
    # passed as CLI args to this one process) -- so a later ad-hoc
    # `docker exec ... odoo shell`/`odoo -i ...` call against the long-running
    # `odoo` service below can also connect, with no SSH/systemd equivalent
    # of "reconfigure the host" needed. See DECISIONS.md, Stage 5.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '[options]\ndb_host = postgres\ndb_port = 5432\ndb_user = ${OMA_PG_USER:-oma}\ndb_password = ${OMA_PG_PASSWORD:-oma_dev_password}\naddons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons\n' > /etc/odoo/odoo.conf
        exec odoo -d ${ODOO_DB_NAME:-odoo16_dev} -i base --stop-after-init
    restart: "no"

  odoo:
    image: odoo:16
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    environment:
      HOST: postgres
      PORT: "5432"
      USER: ${OMA_PG_USER:-oma}
      PASSWORD: ${OMA_PG_PASSWORD:-oma_dev_password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '[options]\ndb_host = postgres\ndb_port = 5432\ndb_user = ${OMA_PG_USER:-oma}\ndb_password = ${OMA_PG_PASSWORD:-oma_dev_password}\naddons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons\n' > /etc/odoo/odoo.conf
        exec odoo -d ${ODOO_DB_NAME:-odoo16_dev}
    volumes:
      - odoo_filestore:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${ODOO_HOST_PORT:-8069}:8069"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama pull ${OMA_MODEL_BUILD:-qwen2.5-coder:7b} &&
        ollama pull ${OMA_MODEL_MANAGER:-qwen2.5:7b-instruct} &&
        ollama pull ${OMA_MODEL_FAST_EXTRACTION:-qwen2.5:3b-instruct}
    restart: "no"

  # Cloud mode only (OMA_LLM_MODE=cloud): `docker compose --profile cloud up -d`.
  # Self-hosted, free, open-source proxy that exposes the real Anthropic API
  # (using a key the operator supplies) behind the same OpenAI-compatible
  # wire protocol infra/gateway_client.py already speaks -- so switching modes
  # is a config change, not a second code path.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["cloud"]
    environment:
      ANTHROPIC_API_KEY: ${OMA_CLOUD_ESCALATION_API_KEY:-}
      OPENAI_API_KEY: ${OMA_CLOUD_ESCALATION_API_KEY:-}
      LITELLM_MASTER_KEY: ${OMA_MODEL_GATEWAY_API_KEY:-sk-oma-local}
    command: ["--config", "/app/config.yaml"]
    volumes:
      - ./docker/litellm-config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__DOMAIN: gitea
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__log__LEVEL: warn
    volumes:
      - gitea_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${GITEA_HOST_PORT:-3000}:3000"

  # Not started by default -- see README "Running the app" for why. The
  # Build/Testing-QA specialists need `docker exec` access to the sibling
  # `odoo` container (tools_odoo/module_dev/toolchain.py's
  # _run_in_container()); giving a container that access means mounting the
  # host's real Docker socket into it, which grants full control over the
  # whole Docker daemon -- a meaningfully bigger attack surface than this
  # app actually needs, and in tension with this project's own
  # "sandboxed, allow-listed execution" design. The default path runs this
  # process on the host instead (plain `uvicorn ui.chat.server:app`, same
  # venv as everything else), where `docker exec` is just the normal
  # Docker CLI a developer already has -- zero socket-mounting needed. This
  # service is kept for anyone who wants full containerization anyway and
  # is comfortable with that tradeoff; see DECISIONS.md, Stage 6.
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      odoo:
        condition: service_healthy
    env_file:
      - oma/.env
    environment:
      OMA_PG_HOST: postgres
      OMA_PG_PORT: "5432"
      OMA_REDIS_HOST: redis
      OMA_REDIS_PORT: "6379"
      NEO4J_URI: bolt://neo4j:7687
      OMA_ODOO_URL: http://odoo:8069
      OMA_ODOO_CONTAINER: oma-odoo-1
      DEV_AGENT_GITEA_URL: http://gitea:3000
      # Deliberately NOT overriding OMA_MODEL_GATEWAY_URL_* here --
      # infra/settings.py's _default_gateway_base_url() already resolves
      # the right compose service name (`ollama` or `litellm`) from
      # OMA_LLM_MODE alone, so an explicit override here would hardcode
      # one mode and silently defeat the switch for the other.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"

volumes:
  pgdata:
  neo4jdata:
  odoo_filestore:
  odoo_addons:
  ollama_models:
  gitea_data:
